[package]
name         = "scheduler-pattern"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/scheduler-pattern"
rust-version = "1.98"
description  = "Time-based scheduling contract: schedule a job to run once after a delay or repeatedly on a fixed interval, cancel it, get notified of failures. Zero implementation, zero knowledge of any specific scheduling backend."
keywords     = ["scheduler", "cron", "timer", "pattern", "swe"]
categories   = ["asynchronous"]

[package.metadata.arch]
application_type = "port"
service_type     = "scheduler"

[lib]
name = "scheduler_pattern"
path = "src/lib.rs"

[dependencies]
futures   = "0.3"
thiserror = "2.0"
uuid      = { version = "1.23", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
